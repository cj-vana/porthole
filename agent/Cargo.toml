[package]
name = "porthole-agent"
version = "0.1.0"
edition = "2021"
description = "Linux agent for Porthole: captures the desktop, NVENC-encodes it, and streams it to a Mac client over LAN."
license = "MIT OR Apache-2.0"

# Cross-platform dependencies only for now.
#
# TODO(US-001/US-002): Linux-only deps land behind target-gated entries once
# the scaffold runs on Linux, e.g.:
#   [target.'cfg(target_os = "linux")'.dependencies]
#   gstreamer = "..."   # capture + NVENC encode pipeline (needs system GStreamer dev packages)
#   x11rb               # X11 (XShm/XDamage) fallback capture
# TODO(US-006/US-014): evdev/uinput for keyboard/mouse/gamepad injection (Linux-only).
[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
