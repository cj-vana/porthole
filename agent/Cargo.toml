[package]
name = "porthole-agent"
version = "0.1.0"
edition = "2021"
description = "Linux agent for Porthole: captures the desktop, NVENC-encodes it, and streams it to a Mac client over LAN."
license = "MIT"

# Cross-platform dependencies only in this section.
[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2" # gethostname (default machine name); memfd_create on Linux
mdns-sd = "0.13" # _porthole._tcp announce (FR-8), pure Rust, no system deps
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
png = "0.17" # examples/thumb_fetch.rs writes PNGs

# Linux-only screen capture (US-001): wlr-screencopy-unstable-v1 over Wayland.
# The wayland-rs crates are pure Rust and need no system libraries.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# virtual-keyboard-unstable-v1 bindings for input injection (US-006);
# generated from the vendored XML (see src/input/wayland.rs) because the
# wayland-protocols crate no longer ships this protocol.
wayland-scanner = "0.31"
wayland-backend = "0.3" # referenced by the generated protocol bindings
memmap2 = "0.9"
serde_json = "1" # parsing `hyprctl monitors -j` for virtual display setup (US-015)
xkbcommon = "0.9" # building the virtual keyboard keymap (links system libxkbcommon)
evdev = "0.13" # virtual uinput gamepad (US-014)

# TODO(US-002): GStreamer for the encode pipeline needs system dev packages:
#   [target.'cfg(target_os = "linux")'.dependencies]
#   gstreamer = "..."
