[package]
name = "porthole-agent"
version = "0.1.0"
edition = "2021"
description = "Linux agent for Porthole: captures the desktop, NVENC-encodes it, and streams it to a Mac client over LAN."
license = "MIT OR Apache-2.0"

# Cross-platform dependencies only in this section.
[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Linux-only screen capture (US-001): wlr-screencopy-unstable-v1 over Wayland.
# The wayland-rs crates are pure Rust and need no system libraries.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
memmap2 = "0.9"
libc = "0.2" # memfd_create for shm frame buffers
serde_json = "1" # parsing `hyprctl monitors -j` for virtual display setup (US-015)

# TODO(US-002): GStreamer for the encode pipeline needs system dev packages:
#   [target.'cfg(target_os = "linux")'.dependencies]
#   gstreamer = "..."
# TODO(US-006/US-014): evdev/uinput for keyboard/mouse/gamepad injection.
