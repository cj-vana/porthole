# porthole-agent configuration (PRD FR-11: single config file).
# All fields optional; uncomment to override. CLI flags override file values.

# UDP port for the video stream.
# port_video = 52800

# TCP port for the control channel (handshake, settings, keyframe requests).
# port_control = 52801

# UDP port for the Opus audio stream.
# port_audio = 52802

# TCP port for the thumbnail endpoint (machine picker).
# port_thumbnail = 52803

# Machine name announced via mDNS and shown in the picker (default: hostname).
# name = "my-linux-box"

# NVENC/VAAPI target bitrate in Mbps (40 is the PRD default for 1440p LAN quality mode).
# bitrate_mbps = 40

# Keyframe (IDR) interval in seconds.
# keyframe_interval_secs = 2

# Video codec: "h264" (default) or "hevc".
# codec = "h264"

# Hardware encoder backend: "nvenc" (default, NVIDIA dGPU) or "vaapi"
# (Ryzen iGPU; keeps the dGPU free for gaming).
# encoder = "nvenc"

# Stream framerate: 60 (default), 120, or 144.
# fps = 60

# Virtual display for headless operation (US-015, Hyprland only): when set
# and no physical monitor is attached, the agent creates a headless output at
# this geometry and captures it. Unset by default.
# virtual_display = "2560x1440@144"

# Path MTU the video datagrams are sized for (576 to 9000). The default fits
# the IPv6 minimum and WireGuard/Tailscale tunnels; use 1500 on plain
# Ethernet. A datagram larger than the path MTU gets IP-fragmented, and one
# lost piece loses the whole datagram.
# mtu = 1280

# DRM render node for the VAAPI encoder. Unset by default: the agent picks
# one at encoder start (amdgpu, then i915, then xe, never nvidia).
# vaapi_device = "/dev/dri/renderD129"

# Start in the low-latency encoder bias (gaming mode). The Mac client also
# toggles this at runtime; this is only the startup default.
# low_latency = false
