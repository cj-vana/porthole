name: Porthole
options:
  bundleIdPrefix: com.porthole
  createIntermediateGroups: true
targets:
  Porthole:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Porthole
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.porthole.mac
        PRODUCT_NAME: Porthole
        INFOPLIST_FILE: Porthole/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        # Ad hoc ("Sign to Run Locally"): no developer cert needed for LAN dev builds.
        CODE_SIGN_IDENTITY: "-"
        # App sandbox deliberately OFF for now; see README (raw UDP/TCP + GameController).
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
  porthole-decode-test:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    # Headless gate for the US-005 decode path; shares the streaming
    # primitives with the app, no app/UI code.
    sources:
      - path: DecodeTest
      - path: Porthole/Streaming/WireProtocol.swift
      - path: Porthole/Streaming/AnnexB.swift
      - path: Porthole/Streaming/H264SPS.swift
      - path: Porthole/Streaming/VideoDecoder.swift
      - path: Porthole/Streaming/H264Decoder.swift
    settings:
      base:
        PRODUCT_NAME: porthole-decode-test
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"
  porthole-input-test:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    # Headless gate for the US-006 input path: byte-exact translation tests
    # plus a live mode that sends input to a real agent using the app's own
    # ControlChannel and InputController.
    sources:
      - path: InputTest
      - path: Porthole/Streaming/WireProtocol.swift
      - path: Porthole/Streaming/ClientClock.swift
      - path: Porthole/Streaming/ControlChannel.swift
      - path: Porthole/Discovery/Machine.swift
      - path: Porthole/Input/KeyMap.swift
      - path: Porthole/Input/InputMessages.swift
      - path: Porthole/Input/InputController.swift
      - path: Porthole/Input/SystemShortcutCapture.swift
    settings:
      base:
        PRODUCT_NAME: porthole-input-test
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"
schemes:
  Porthole:
    build:
      targets:
        Porthole: all
    run:
      config: Debug
  porthole-decode-test:
    build:
      targets:
        porthole-decode-test: all
    run:
      config: Debug
  porthole-input-test:
    build:
      targets:
        porthole-input-test: all
    run:
      config: Debug
