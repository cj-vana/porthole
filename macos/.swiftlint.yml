# Porthole Mac client — light SwiftLint config.
# Kept deliberately loose for the scaffold; tighten as the codebase grows.
opt_in_rules:
  - empty_count
  - first_where
line_length:
  warning: 120
  error: 140
type_body_length:
  warning: 250
  error: 350
file_length:
  warning: 400
  error: 600
excluded:
  - Porthole.xcodeproj
