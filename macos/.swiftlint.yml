# Porthole Mac client SwiftLint config. `swiftlint lint --strict` from macos/
# is a gate, so every rule here is tuned on purpose rather than left loose.
opt_in_rules:
  - empty_count
  - first_where
line_length:
  warning: 120
  error: 140
# Coordinate and color-math names that the domain spells this way: x/y
# for output pixels, dx/dy for relative motion, kr/kb/kg for the YCbCr
# matrix coefficients, id for Identifiable. Note that `excluded` replaces
# SwiftLint's default list, which is why `id` is repeated here.
identifier_name:
  excluded:
    - x
    - y
    - kr
    - kb
    - kg
    - id
    - dx
    - dy
# The stream coordinator, zero-copy reassembler, and Metal renderer each keep
# one performance-critical state machine together. Cross-file extensions would
# require widening private hot-path state. The limits still catch accidental
# growth while accommodating those three cohesive types.
type_body_length:
  warning: 500
  error: 600
# MetalRenderer includes the shader-binding code beside its swapchain state;
# keeping those private details in one file is safer than a broad internal API.
file_length:
  warning: 650
  error: 750
excluded:
  - Porthole.xcodeproj
  - build
