# Porthole Mac client SwiftLint config. `swiftlint lint --strict` from macos/
# is a gate, so every rule here is tuned on purpose rather than left loose.
opt_in_rules:
  - empty_count
  - first_where
line_length:
  warning: 120
  error: 140
# Coordinate and color-math names that the domain spells this way: x/y
# for output pixels, dx/dy for relative motion, kr/kb/kg for the YCbCr
# matrix coefficients, id for Identifiable. Note that `excluded` replaces
# SwiftLint's default list, which is why `id` is repeated here.
identifier_name:
  excluded:
    - x
    - y
    - kr
    - kb
    - kg
    - id
    - dx
    - dy
# StreamSession coordinates connect, reassembly, decode, latency stats and
# input for one session; splitting it further would scatter one lifecycle
# across files. Warning raised from the 250 default to 300, error to 400.
type_body_length:
  warning: 300
  error: 400
# StreamSession.swift again: US-013 adds runtime settings and the codec
# switch to the same lifecycle, then US-009 wires the audio receiver and
# player into it. Splitting the audio hooks out would need the session's
# private state opened up to a cross-file extension, which is the scatter
# the type_body_length note above rejects. Warning raised to 500, error
# kept at 600.
file_length:
  warning: 500
  error: 600
excluded:
  - Porthole.xcodeproj
  - build
